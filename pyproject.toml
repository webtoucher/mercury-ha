[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# В русских докстрингах и комментариях кириллица соседствует с латиницей — это не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Тесты лежат отдельными файлами без пакета.
"tests/*" = ["INP001"]
